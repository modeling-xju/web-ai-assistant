<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">web-ai-assistant 挂件动效演示</title>
  <desc id="heroDesc">一个网页右下角的 AI 助手挂件：展开、发问、流式回答、显示参考资料与热词，点击页面空白处后收起。</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ink { fill: #17161A; }
    .paper { fill: #FBFAF7; }
    .accent { fill: #D8402F; }
    .muted { fill: #6E6A66; }
    .line { stroke: rgba(23,22,26,.16); }
    .rule { stroke: rgba(23,22,26,.20); }

    /* 12 秒一循环 */
    @keyframes launcherIn { 0%,1%{opacity:0;transform:translateY(8px)} 4%,100%{opacity:1;transform:none} }
    @keyframes panelIn {
      0%,8.3%    { opacity:0; transform:translateY(12px) scale(.97) }
      13.3%,75%  { opacity:1; transform:none }
      79%,100%   { opacity:0; transform:translateY(12px) scale(.97) }
    }
    @keyframes badgePulse { 0%,6%{opacity:0;transform:scale(.4)} 10%,14%{opacity:1;transform:none} 20%,100%{opacity:0} }
    @keyframes bubbleIn { 0%,16%{opacity:0;transform:translateY(5px)} 20%,74%{opacity:1;transform:none} 75%,100%{opacity:0} }
    @keyframes l1 { 0%,25%{opacity:0} 27%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes l2 { 0%,29%{opacity:0} 31%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes l3 { 0%,33%{opacity:0} 35%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes caret { 0%,25%{opacity:0} 27%,39%{opacity:1} 41%,43%{opacity:0} 45%,47%{opacity:1} 49%,74%{opacity:0} 75%,100%{opacity:0} }
    @keyframes refsIn { 0%,43%{opacity:0} 46%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes hotIn { 0%,50%{opacity:0} 53%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes cursorPath {
      0%,54%   { transform:translate(560px,300px); opacity:0 }
      56%      { transform:translate(560px,300px); opacity:1 }
      66%,78%  { transform:translate(150px,210px); opacity:1 }
      80%,100% { transform:translate(150px,210px); opacity:0 }
    }
    @keyframes ripple { 0%,66%{opacity:0;transform:scale(.3)} 68%{opacity:.55;transform:scale(1)} 74%,100%{opacity:0;transform:scale(1.35)} }
    @keyframes statusBusy { 0%,25%{opacity:0} 27%,44%{opacity:1} 46%,100%{opacity:0} }
    @keyframes statusIdle { 0%,44%{opacity:0} 46%,74%{opacity:1} 75%,100%{opacity:0} }
    @keyframes headPulse { 0%,27%{opacity:.35} 30%,43%{opacity:1} 46%,100%{opacity:.35} }

    #launcher { animation: launcherIn 12s infinite both }
    #panel    { animation: panelIn 12s infinite both; transform-origin: 780px 392px }
    #badge    { animation: badgePulse 12s infinite both; transform-origin: 774px 412px }
    #bubble   { animation: bubbleIn 12s infinite both }
    #l1       { animation: l1 12s infinite both }
    #l2       { animation: l2 12s infinite both }
    #l3       { animation: l3 12s infinite both }
    #caret    { animation: caret 12s infinite both }
    #refs     { animation: refsIn 12s infinite both }
    #hot      { animation: hotIn 12s infinite both }
    #cursor   { animation: cursorPath 12s infinite both }
    #ripple   { animation: ripple 12s infinite both; transform-origin: 150px 210px }
    #stBusy   { animation: statusBusy 12s infinite both }
    #stIdle   { animation: statusIdle 12s infinite both }
    #pulse    { animation: headPulse 12s infinite both }

    @media (prefers-reduced-motion: reduce) {
      #launcher,#panel,#badge,#bubble,#l1,#l2,#l3,#refs,#hot,#cursor,#ripple,#stBusy,#stIdle,#pulse { animation: none }
      #panel,#bubble,#l1,#l2,#l3,#refs,#hot { opacity: 1 }
      #caret,#cursor,#ripple,#badge { opacity: 0 }
      #stBusy { opacity: 0 } #stIdle, #pulse { opacity: 1 }
    }
  </style>

  <!-- 被演示的"别人的网站" -->
  <rect x="0.5" y="0.5" width="799" height="469" rx="10" fill="#FBFAF7" stroke="rgba(23,22,26,.18)"/>
  <line x1="0" y1="56" x2="800" y2="56" class="rule"/>
  <text x="28" y="36" class="sans ink" font-size="16" letter-spacing="6">野径</text>
  <text x="120" y="35" class="sans muted" font-size="12">豆子</text>
  <text x="162" y="35" class="sans muted" font-size="12">冲煮</text>
  <text x="204" y="35" class="sans muted" font-size="12">配送</text>
  <rect x="620" y="22" width="152" height="24" rx="2" fill="none" class="line"/>
  <text x="632" y="38" class="sans muted" font-size="11">站内搜索</text>

  <text x="28" y="112" class="sans ink" font-size="26">把一支豆子烘到它该有的样子</text>
  <rect x="28" y="140" width="380" height="8" rx="4" fill="rgba(23,22,26,.10)"/>
  <rect x="28" y="158" width="300" height="8" rx="4" fill="rgba(23,22,26,.10)"/>
  <rect x="28" y="200" width="180" height="110" rx="3" fill="none" class="line"/>
  <rect x="222" y="200" width="180" height="110" rx="3" fill="none" class="line"/>
  <rect x="416" y="200" width="180" height="110" rx="3" fill="none" class="line"/>

  <!-- 点击波纹 -->
  <circle id="ripple" cx="150" cy="210" r="26" fill="none" stroke="#D8402F" stroke-width="2"/>

  <!-- 鼠标指针 -->
  <g id="cursor">
    <path d="M0 0 L0 16 L4.4 12.2 L7.2 18.4 L10.2 17 L7.4 10.9 L13 10.6 Z" fill="#17161A" stroke="#FBFAF7" stroke-width="1.2"/>
  </g>

  <!-- 挂件面板 -->
  <g id="panel">
    <rect x="470" y="56" width="310" height="336" rx="3" fill="#FBFAF7" stroke="rgba(23,22,26,.38)"/>
    <!-- 标题栏 -->
    <line x1="470" y1="92" x2="780" y2="92" class="line"/>
    <circle id="pulse" cx="488" cy="74" r="3" fill="#D8402F"/>
    <text x="500" y="79" class="sans ink" font-size="13" font-weight="600" letter-spacing="1">野径咖啡</text>
    <text id="stBusy" x="684" y="78" class="mono" font-size="9.5" fill="#D8402F" text-anchor="end">正在回答</text>
    <text id="stIdle" x="684" y="78" class="mono" font-size="9.5" fill="#6E6A66" text-anchor="end">在线</text>
    <g fill="none" stroke="#6E6A66" stroke-width="1.4" stroke-linecap="round">
      <path d="M706 74h10M711 69v10"/>
      <path d="M734 70h10M734 74h10M734 78h10"/>
      <path d="M760 70l8 8M768 70l-8 8"/>
    </g>

    <!-- 用户消息 -->
    <g id="bubble">
      <rect x="596" y="108" width="166" height="34" rx="3" class="ink"/>
      <text x="610" y="130" class="sans" font-size="12.5" fill="#FBFAF7">保修怎么查？</text>
    </g>

    <!-- 助手消息：竖线 + 逐行出现 -->
    <rect x="488" y="158" width="2" height="70" class="accent"/>
    <text id="l1" x="500" y="172" class="sans ink" font-size="12.5">整机保修 3 年，机芯 5 年。</text>
    <text id="l2" x="500" y="194" class="sans ink" font-size="12.5">• 以发票日期为准</text>
    <text id="l3" x="500" y="216" class="sans ink" font-size="12.5">• 上门安装免费</text>
    <rect id="caret" x="608" y="204" width="7" height="12" class="accent"/>

    <!-- 参考资料 -->
    <g id="refs">
      <line x1="488" y1="246" x2="762" y2="246" stroke="rgba(23,22,26,.22)" stroke-dasharray="4 4"/>
      <text x="488" y="264" class="mono" font-size="10" fill="#6E6A66">参考资料 · 2</text>
    </g>

    <!-- 热词条 -->
    <g id="hot">
      <text x="488" y="319" class="mono" font-size="9.5" fill="#6E6A66" letter-spacing="1">热词</text>
      <rect x="524" y="304" width="82" height="22" rx="11" fill="none" class="line"/>
      <text x="552" y="319" class="sans ink" font-size="11.5">怎么冲</text>
      <rect x="612" y="304" width="76" height="22" rx="11" fill="none" class="line"/>
      <text x="640" y="319" class="sans ink" font-size="11.5">多久发</text>
      <rect x="694" y="304" width="68" height="22" rx="11" fill="none" class="line"/>
      <text x="722" y="319" class="sans ink" font-size="11.5">保存</text>
    </g>

    <!-- 输入区 -->
    <line x1="470" y1="340" x2="780" y2="340" class="line"/>
    <text x="488" y="365" class="sans muted" font-size="12.5">输入你的问题…</text>
    <path d="M732 344 H766 V370 L740 378 H732 Z" class="ink"/>
    <path d="M745 367 V352 M739 358 L745 352 L751 358" fill="none" stroke="#FBFAF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 启动器 -->
  <g id="launcher">
    <path d="M732 406 H780 V439 L759 460 H732 Z" class="ink"/>
    <path d="M741 420 H762 L768 426 V448 H741 Z" fill="none" stroke="#FBFAF7" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M747 432 H760 M747 439 H756" fill="none" stroke="#FBFAF7" stroke-width="1.5" stroke-linecap="round"/>
    <circle id="badge" cx="776" cy="411" r="5" fill="#D8402F"/>
  </g>
</svg>
