<!--
  自建挂件 · 静态站挂载模板（路径 B）

  用法：
    1. 把 ai-assistant.js 和 ai-assistant.css 拷到站点静态目录（两个文件必须放同一目录，
       JS 会按自己的 src 去找同名的 .css）。样式表是注入 Shadow Root 的，不会影响站点。
    2. 改下面 <script> 上的 data-* 属性。
    3. 整段粘到 </body> 之前。

  挂件自带这些能力，不用自己实现：点击面板外部收起、多会话历史与「新对话」、
  跨访问的记忆、热词（可远程拉取）、知识库引用展示。配置见下面速查表。

  本地先看到效果：把 data-transport 设成 "echo"，不发任何网络请求也能跑通交互。
  要接真实模型，把 data-transport 改回 "openai" 并指向你的后端。
-->

<script src="/static/ai-assistant.js"
        data-waa
        data-name="小助"
        data-transport="openai"
        data-endpoint="/api/assistant/chat"
        data-model="qwen-plus"

        data-greeting="关于这台机器，你想问什么？"
        data-suggestions="保修怎么查|能开发票吗|多久到货"
        data-hot-words-url="/api/hot-words"

        data-storage="local"
        data-close-on-outside-click="true"
        data-memory="true"
        data-history="true"

        data-theme="auto"
        data-position="right"
        data-draggable="true"
        data-auto-open="false"
        ></script>

<!--
  data-* 速查
    data-name         标题栏里的名字
    data-provider     大模型服务商预设：openai | dashscope | deepseek | moonshot |
                      zhipu | siliconflow | openrouter | ollama | vllm | anthropic
                      （填了它就不用自己抄 endpoint / model / 鉴权方式）
    data-transport    openai | anthropic | dashscopeApp | echo，或你注册的自定义名字
    data-endpoint     后端地址（openai 协议就是这个接口）
    data-model        模型名
    data-app-id       百炼应用 ID（transport=dashscopeApp 时用）
    data-greeting     空态问候语。按业务亲手写
    data-suggestions  空态问题示例，用 | 分隔，2–4 条
    data-hot-words    热词，用 | 分隔（静态兜底）
    data-hot-words-url 从后端拉热词（返回数组或 {items:[]}），拉不到就用上面那份
    data-hot-words-placement  empty | composer | both | off，默认 both
    data-storage      session（默认，关标签页就清）| local（跨访问保留）| none
    data-memory       true | false，是否启用记忆
    data-history      true | false，是否启用多会话历史
    data-close-on-outside-click  true（默认）| false
    data-shortcuts    true（默认）| false，快捷键总开关
    data-outside-ignore  站点自己的弹层选择器（逗号分隔），点它不算"外部点击"
    data-theme        auto | light | dark
    data-position     right | left
    data-draggable    true | false
    data-auto-open    true | false（默认 false，建议保持）
    data-accent       主色，如 #0F766E
    data-radius       圆角，如 3px
    data-z-index      默认 2147483000
    data-css-url      样式表地址（打包过的 SPA 必须给）

  知识库（RAG）、记忆的写入、自定义检索钩子这些没法用 data-* 表达，
  要用 JS 挂载，见 references/self-hosted-widget.md。
-->

  ⚠ 不要做的事：把 API Key 写在这里。
    静态页面是公开的，写进去等于公开。key 放后端，前端打自己的接口。
-->
